name: Build anland KWin / Xwayland (ALARM aarch64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'producers/kde/Arch_v5/**'
      - '.github/workflows/build-kwin-arch-alarm.yml'
  schedule:
    # 每天 0:00（北京时间，UTC+8 → 16:00 UTC）自动构建
    - cron: '0 16 * * *'

permissions:
  contents: read

concurrency:
  group: build-kwin-arch-alarm
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ALARM rootfs tarball
        id: cache-rootfs
        uses: actions/cache@v4
        with:
          path: /home/runner/alarm/ArchLinuxARM-aarch64-latest.tar.gz
          # 上游 tarball 更新时把 key 里的版本号 +1 即可
          key: alarm-aarch64-rootfs-v1

      - name: Download ALARM aarch64 rootfs
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/alarm
          curl -fL --retry 3 -o /home/runner/alarm/ArchLinuxARM-aarch64-latest.tar.gz \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz

      - name: Extract rootfs
        run: |
          sudo rm -rf /home/runner/alarm/rootfs
          sudo mkdir -p /home/runner/alarm/rootfs
          sudo tar -xzf /home/runner/alarm/ArchLinuxARM-aarch64-latest.tar.gz -C /home/runner/alarm/rootfs
          # DNS：优先复用宿主机 resolver（runner 上 systemd-resolved 监听 127.0.0.53）
          sudo rm -f /home/runner/alarm/rootfs/etc/resolv.conf
          sudo touch /home/runner/alarm/rootfs/etc/resolv.conf
          if ! sudo mount --bind /etc/resolv.conf /home/runner/alarm/rootfs/etc/resolv.conf 2>/dev/null; then
            printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee /home/runner/alarm/rootfs/etc/resolv.conf
          fi
          # ALARM 的 nsswitch 用 systemd-resolved 的 resolve 模块，绑上宿主机 socket 目录
          if [ -d /run/systemd/resolve ]; then
            sudo mkdir -p /home/runner/alarm/rootfs/run/systemd
            sudo mount --bind /run/systemd/resolve /home/runner/alarm/rootfs/run/systemd/resolve 2>/dev/null || true
          fi
          # 部分工具会读 /proc、/dev（如 python、gpg）
          sudo mount --bind /proc /home/runner/alarm/rootfs/proc
          sudo mount --bind /dev /home/runner/alarm/rootfs/dev

      - name: Mount repo into chroot
        run: |
          # 直接 bind-mount 整个仓库：Arch_v5/kwin 是指向 anland_backend_Arch_v5 的
          # 符号链接，只拷子目录会变成断链
          sudo mkdir -p /home/runner/alarm/rootfs/home/builder/anland
          sudo mount --bind "$GITHUB_WORKSPACE" /home/runner/alarm/rootfs/home/builder/anland
          # 把 bootstrap 脚本写成文件，避免 bash -c 嵌套引号问题
          sudo tee /home/runner/alarm/rootfs/root/bootstrap.sh > /dev/null <<'BOOTSTRAP'
          set -e
          # GitHub runner 内核不支持 Landlock，pacman 6.1+ 的沙箱会失败，关掉它
          sed -i "s/^#DisableSandbox/DisableSandbox/" /etc/pacman.conf
          grep -q "^DisableSandbox" /etc/pacman.conf || \
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
          # chroot 里 /proc/self/mountinfo 是宿主机挂载表，pacman 空间检查会误判，关掉
          sed -i "s/^CheckSpace/#CheckSpace/" /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm base-devel sudo git
          useradd -m builder 2>/dev/null || true
          chown builder:builder /home/builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          # 预装两个 PKGBUILD 的全部依赖，并让 makepkg 去掉 -s（chroot 内不依赖 sudo）
          cd /home/builder/anland/producers/kde/Arch_v5
          deps=$(awk '/^depends=\(/,/^\)/{ if ($0 !~ /^depends=\(/ && $0 !~ /^\)/) print }
                 /^makedepends=\(/,/^\)/{ if ($0 !~ /^makedepends=\(/ && $0 !~ /^\)/) print }' \
                 PKGBUILD xorg-xwayland.PKGBUILD | tr '\n' ' ')
          pacman -S --noconfirm --needed $deps
          sed -i "s/MAKEPKG_ARGS=(-C -f -s --clean)/MAKEPKG_ARGS=(-C -f --clean)/" build.sh
          BOOTSTRAP

      - name: Bootstrap ALARM (keyring + base-devel + deps)
        run: sudo chroot /home/runner/alarm/rootfs /bin/bash /root/bootstrap.sh

      - name: Build kwin + xwayland packages (emulated)
        run: |
          sudo chroot /home/runner/alarm/rootfs /bin/bash -c '
            su builder -c "cd ~/anland/producers/kde/Arch_v5 && INSTALL=0 JOBS=\$(nproc) ./build.sh"
            echo "--- packages dir (inside chroot) ---"
            ls -la /home/builder/.cache/anland/kwin-arch/packages/ || true
            mkdir -p /root/packages
            cp -v /home/builder/.cache/anland/kwin-arch/packages/*.pkg.tar.* /root/packages/ || true
          '

      - name: Collect packages
        run: |
          mkdir -p /home/runner/alarm/packages
          sudo find /home/runner/alarm/rootfs/root/packages \
            -name '*.pkg.tar.*' -exec cp {} /home/runner/alarm/packages/ \;
          ls -lh /home/runner/alarm/packages/
          test -n "$(ls /home/runner/alarm/packages/)" || { echo 'no packages produced'; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: anland-kwin-arch-aarch64
          path: /home/runner/alarm/packages/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14
