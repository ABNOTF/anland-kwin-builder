name: Build anland KWin / Xwayland (ALARM aarch64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'producers/kde/Arch_v5/**'
      - '.github/workflows/build-kwin-arch-alarm.yml'
  schedule:
    # 每周一 04:00 UTC 构建一次，跟上上游依赖变化
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: build-kwin-arch-alarm
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU user-mode emulation (aarch64)
        run: |
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          test -f /usr/bin/qemu-aarch64-static
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Cache ALARM rootfs tarball
        id: cache-rootfs
        uses: actions/cache@v4
        with:
          path: /tmp/alarm/ArchLinuxARM-aarch64-latest.tar.gz
          # 上游 tarball 更新时把 key 里的版本号 +1 即可
          key: alarm-aarch64-rootfs-v1

      - name: Download ALARM aarch64 rootfs
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/alarm
          curl -fL --retry 3 -o /tmp/alarm/ArchLinuxARM-aarch64-latest.tar.gz \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz

      - name: Extract rootfs
        run: |
          sudo rm -rf /tmp/alarm/rootfs
          sudo mkdir -p /tmp/alarm/rootfs
          sudo tar -xzf /tmp/alarm/ArchLinuxARM-aarch64-latest.tar.gz -C /tmp/alarm/rootfs
          # 让 chroot 内的 aarch64 二进制能被内核交给 qemu 解释执行
          sudo cp /usr/bin/qemu-aarch64-static /tmp/alarm/rootfs/usr/bin/
          # DNS：优先复用宿主机 resolver（runner 上 systemd-resolved 监听 127.0.0.53）
          sudo rm -f /tmp/alarm/rootfs/etc/resolv.conf
          sudo touch /tmp/alarm/rootfs/etc/resolv.conf
          if ! sudo mount --bind /etc/resolv.conf /tmp/alarm/rootfs/etc/resolv.conf 2>/dev/null; then
            printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee /tmp/alarm/rootfs/etc/resolv.conf
          fi
          # ALARM 的 nsswitch 用 systemd-resolved 的 resolve 模块，绑上宿主机 socket 目录
          if [ -d /run/systemd/resolve ]; then
            sudo mkdir -p /tmp/alarm/rootfs/run/systemd
            sudo mount --bind /run/systemd/resolve /tmp/alarm/rootfs/run/systemd/resolve 2>/dev/null || true
          fi
          # 部分工具会读 /proc、/dev（如 python、gpg）
          sudo mount --bind /proc /tmp/alarm/rootfs/proc
          sudo mount --bind /dev /tmp/alarm/rootfs/dev

      - name: Bootstrap ALARM (keyring + base-devel + sudo)
        run: |
          sudo chroot /tmp/alarm/rootfs /bin/bash -c '
            set -e
            # GitHub runner 内核不支持 Landlock，pacman 6.1+ 的沙箱会失败，关掉它
            sed -i "s/^#DisableSandbox/DisableSandbox/" /etc/pacman.conf
            grep -q "^DisableSandbox" /etc/pacman.conf || \
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            # chroot 里 /proc/self/mountinfo 是宿主机挂载表，pacman 空间检查会误判，
            # 直接关掉 CheckSpace
            sed -i "s/^CheckSpace/#CheckSpace/" /etc/pacman.conf
            echo "--- resolver in chroot ---"
            cat /etc/resolv.conf
            getent hosts mirror.archlinuxarm.org || echo "RESOLVE_FAILED"
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Sy --noconfirm archlinuxarm-keyring
            pacman -Syu --noconfirm base-devel sudo git
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          '

      - name: Mount repo into chroot
        run: |
          # 直接 bind-mount 整个仓库：Arch_v5/kwin 是指向 anland_backend_Arch_v5 的
          # 符号链接，只拷子目录会变成断链
          sudo mkdir -p /tmp/alarm/rootfs/home/builder/anland
          sudo mount --bind "$GITHUB_WORKSPACE" /tmp/alarm/rootfs/home/builder/anland

      - name: Build kwin + xwayland packages (emulated)
        run: |
          sudo chroot /tmp/alarm/rootfs /bin/su - builder -c \
            "cd ~/anland/producers/kde/Arch_v5 && INSTALL=0 JOBS=\$(nproc) ./build.sh"

      - name: Collect packages
        run: |
          mkdir -p /tmp/alarm/packages
          sudo find /tmp/alarm/rootfs/home/builder/.cache/anland/kwin-arch/packages \
            -name '*.pkg.tar.zst' -exec cp {} /tmp/alarm/packages/ \;
          ls -lh /tmp/alarm/packages/
          test -n "$(ls /tmp/alarm/packages/)" || { echo 'no packages produced'; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: anland-kwin-arch-aarch64
          path: /tmp/alarm/packages/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
